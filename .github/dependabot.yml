# Dependabot Configuration
#
# Keeps dependencies current by automatically opening pull requests when updates
# become available. Go modules are checked daily while GitHub Actions are
# checked weekly.
#
# Related packages (OpenTelemetry, GoCloud) are grouped into combined PRs to
# reduce noise. Patch-level updates auto-merge after CI passes via the
# dependabot-automerge workflow.

version: 2
updates:
  # 📦 Go module dependencies
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "go.mod"
    labels:
      - dependencies
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      gocloud:
        patterns:
          - "gocloud.dev/*"

  # ⚙️ GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "github"
    labels:
      - dependencies
